plugins {
    id 'java-library'
}

group = 'org.apache.kafka.security'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation('net.bytebuddy:byte-buddy:1.14.12')
    implementation('net.bytebuddy:byte-buddy-agent:1.14.12')
    implementation('org.ow2.asm:asm:9.7')
    implementation('org.ow2.asm:asm-tree:9.7')
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // ✅ FIRST include your compiled classes explicitly
    from(sourceSets.main.output)

    // ✅ THEN include dependencies (fat jar)
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    manifest {
        attributes(
                'Premain-Class': 'org.apache.kafka.security.agent.PolicyAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'net.bytebuddy:byte-buddy:1.14.12'
        force 'net.bytebuddy:byte-buddy-agent:1.14.12'
    }
}