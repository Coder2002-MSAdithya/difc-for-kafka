plugins {
    id 'java-library'
}

group = 'org.apache.kafka.security'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.bytebuddy:byte-buddy:1.14.18'
    implementation 'net.bytebuddy:byte-buddy-agent:1.14.18'
    // Needed because byte-buddy classes reference edu.umd.cs.findbugs.annotations.SuppressFBWarnings;
    // with -Werror enabled, missing annotation types become hard compilation failures.
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // ✅ FIRST include your compiled classes explicitly
    from(sourceSets.main.output)

    // ✅ THEN include dependencies (fat jar)
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'

    manifest {
        attributes(
                'Premain-Class': 'org.apache.kafka.security.agent.PolicyAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}